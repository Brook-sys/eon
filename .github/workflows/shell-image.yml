# shell-image — build e publish da casca no GHCR (D08/D47/D54).
#
# Gatilho MANUAL apenas. A casca rebuilda só quando supervisor/Dockerfile/CI
# mudam (raro — supervisor é imutável por desenho). O binário vivo melhora
# localmente via artefatos vN (D11/D41) e NUNCA passa por esta imagem.
#
# Tags são IMUTÁVEIS (D54): shell-vN publica UMA vez; rollback = repontar o
# stack para shell-v(N-1) (runbook docs/runbooks/deploy-via-portainer.md).
# NUNCA regrave uma tag existente.

name: shell-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag imutável da casca (ex.: shell-v0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          build-args: |
            SHELL_VERSION=${{ inputs.tag }}

      - name: Resumo (cole no runbook de deploy)
        run: |
          echo "Publicado: ghcr.io/${{ github.repository }}:${{ inputs.tag }}"
          echo "Próximos passos: runbook docs/runbooks/deploy-via-portainer.md"
          echo "1. Portainer → Stack eon → repontar imagem → Update com re-pull"
          echo "2. Verificação fora-de-banda OBRIGATÓRIA (container up, health verde, logs, eventos)"
