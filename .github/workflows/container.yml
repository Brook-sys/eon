name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final amd64 image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION=${{ github.sha }} \
            --tag eon:smoke .
      - name: Smoke-test final image and durable volume
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: .github/scripts/container-smoke.sh eon:smoke

  image:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Normalize repository name to lowercase for GHCR references
        run: |
          {
            echo "IMAGE_REPO=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest published image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published manifest and smoke immutable amd64 image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' > /tmp/manifest.json
          python3 - <<'PY'
          import json
          manifest = json.load(open('/tmp/manifest.json', encoding='utf-8'))
          wanted = {'linux/amd64', 'linux/arm64'}
          children = {}
          for item in manifest.get('manifests', []):
              platform = (item.get('platform') or {}).get('os', '') + '/' + (item.get('platform') or {}).get('architecture', '')
              if platform in wanted:
                  children[platform] = item.get('digest', '')
          missing = wanted - children.keys()
          if missing:
              raise SystemExit('published image is missing required platforms: ' + ', '.join(sorted(missing)))
          if any(not digest.startswith('sha256:') for digest in children.values()):
              raise SystemExit('published image has a required platform without an immutable child digest')
          for platform in sorted(wanted):
              print(platform, children[platform])
          PY
          while read -r platform digest; do
            child_image="ghcr.io/${IMAGE_REPO}@$digest"
            docker pull --platform "$platform" "$child_image"
            observed_platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$child_image")
            test "$observed_platform" = "$platform"
            observed_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$child_image")
            test "$observed_revision" = "$EXPECTED_REVISION"
            if [ "$platform" = linux/amd64 ]; then
              .github/scripts/container-smoke.sh "$child_image"
            fi
          done < <(python3 - <<'PY'
          import json
          manifest = json.load(open('/tmp/manifest.json', encoding='utf-8'))
          wanted = {'linux/amd64', 'linux/arm64'}
          for item in manifest['manifests']:
              platform = (item.get('platform') or {}).get('os', '') + '/' + (item.get('platform') or {}).get('architecture', '')
              if platform in wanted:
                  print(platform, item['digest'])
          PY
          )
